<section class="page-header">
  <div>
    <h1>PIN</h1>
    <p>Quản lý mã PIN dùng để xác nhận giao dịch.</p>
  </div>
</section>

<div class="message-slot">
  <p class="success-message" *ngIf="statusMessage">{{ statusMessage }}</p>
  <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
</div>

<section class="form-grid">
  <article class="form-card">
    <span class="card-label">First setup</span>
    <h2>Tạo PIN</h2>
    <p class="card-note">Dùng khi tài khoản chưa có PIN giao dịch.</p>

    <form (ngSubmit)="createPin()">
      <label>
        PIN mới
        <input type="password" name="createPin" [(ngModel)]="createPinRequest.pin" required>
      </label>

      <label>
        Mật khẩu đăng nhập
        <input type="password" name="createPassword" [(ngModel)]="createPinRequest.password" required>
      </label>

      <button type="submit" [disabled]="isLoading || hasPin">
        {{ isLoading ? 'Đang xử lý...' : 'Tạo PIN' }}
      </button>
    </form>
  </article>

  <article class="form-card">
    <span class="card-label">Security</span>
    <h2>Đổi PIN</h2>
    <p class="card-note">Dùng khi bạn muốn thay đổi PIN hiện tại.</p>

    <form (ngSubmit)="updatePin()">
      <label>
        PIN cũ
        <input type="password" name="oldPin" [(ngModel)]="updatePinRequest.oldPin" required>
      </label>

      <label>
        PIN mới
        <input type="password" name="newPin" [(ngModel)]="updatePinRequest.newPin" required>
      </label>

      <label>
        Mật khẩu đăng nhập
        <input type="password" name="updatePassword" [(ngModel)]="updatePinRequest.password" required>
      </label>

      <button type="submit" [disabled]="isLoading || !hasPin">
        {{ isLoading ? 'Đang xử lý...' : 'Đổi PIN' }}
      </button>
    </form>
  </article>
</section>

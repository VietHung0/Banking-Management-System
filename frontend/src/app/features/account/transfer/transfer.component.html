<section class="page-header">
  <div>
    <h1>振込</h1>
    <p>他の口座へ資金を振り込みます。</p>
  </div>
</section>

<section class="work-panel">
  <article class="form-card">
    <span class="card-label">振込手続き</span>
    <h2>振込内容</h2>

    <form (ngSubmit)="onSubmit()">
      <label>
        振込先口座番号
        <input
          type="text"
          name="targetAccountNumber"
          [(ngModel)]="transferRequest.targetAccountNumber"
          (blur)="checkRecipient()"
          required
        >
      </label>

      <p class="lookup-message" *ngIf="isCheckingRecipient">振込先口座を確認中...</p>
      <p class="recipient-message" *ngIf="recipientName">
        受取人名: <strong>{{ recipientName }}</strong>
      </p>
      <p class="error-message" *ngIf="recipientMessage">{{ recipientMessage }}</p>

      <label>
        金額
        <input
          type="number"
          name="amount"
          min="1"
          max="1000000"
          step="1"
          [(ngModel)]="transferRequest.amount"
          required
        >
      </label>

      <label>
        暗証番号
        <input
          type="password"
          name="pin"
          [(ngModel)]="transferRequest.pin"
          required
        >
      </label>

      <label>
        メッセージ
        <textarea
          name="message"
          rows="3"
          maxlength="120"
          [(ngModel)]="transferRequest.message"
          placeholder="例: 8月分のお支払い"
        ></textarea>
      </label>

      <p class="success-message" *ngIf="successMessage">{{ successMessage }}</p>
      <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? '処理中...' : '振込する' }}
      </button>
    </form>
  </article>

  <aside class="guide-card">
    <h2>振込時のご注意</h2>
    <p>振込前に受取人名と口座番号をご確認ください。</p>
    <p>振込は1円以上から入力できます。</p>
    <p>1日あたりの振込上限は1,000,000円です。</p>
  </aside>
</section>

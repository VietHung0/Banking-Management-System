<section class="page-header">
  <div>
    <h1>出金</h1>
    <p>ログイン中の口座から出金します。</p>
  </div>
</section>

<section class="work-panel">
  <article class="form-card">
    <span class="card-label">出金手続き</span>
    <h2>出金内容</h2>

    <form (ngSubmit)="onSubmit()">
      <label>
        金額
        <input
          type="number"
          name="amount"
          min="1000"
          max="500000"
          step="1000"
          [(ngModel)]="withdrawRequest.amount"
          required
        >
      </label>

      <label>
        暗証番号
        <input
          type="password"
          name="pin"
          [(ngModel)]="withdrawRequest.pin"
          required
        >
      </label>

      <p class="success-message" *ngIf="successMessage">{{ successMessage }}</p>
      <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? '処理中...' : '出金する' }}
      </button>
    </form>
  </article>

  <aside class="guide-card">
    <h2>お取引時のご注意</h2>
    <p>出金は1,000円以上、1,000円単位で入力してください。</p>
    <p>1日あたりの出金上限は500,000円です。</p>
    <p>出金金額はご利用可能残高の範囲内で入力してください。</p>
  </aside>
</section>

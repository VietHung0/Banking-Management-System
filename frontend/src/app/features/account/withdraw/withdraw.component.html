<section class="page-header">
  <div>
    <h1>Withdraw</h1>
    <p>Rút tiền từ tài khoản đang đăng nhập.</p>
  </div>
</section>

<section class="work-panel">
  <article class="form-card">
    <span class="card-label">Cash Withdrawal</span>
    <h2>Thông tin rút tiền</h2>

    <form (ngSubmit)="onSubmit()">
      <label>
        Số tiền
        <input
          type="number"
          name="amount"
          min="1"
          max="10000000"
          [(ngModel)]="withdrawRequest.amount"
          required
        >
      </label>

      <label>
        PIN
        <input
          type="password"
          name="pin"
          [(ngModel)]="withdrawRequest.pin"
          required
        >
      </label>

      <p class="success-message" *ngIf="successMessage">{{ successMessage }}</p>
      <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Đang xử lý...' : 'Rút tiền' }}
      </button>
    </form>
  </article>

  <aside class="guide-card">
    <h2>Lưu ý giao dịch</h2>
    <p>Số tiền rút phải nhỏ hơn hoặc bằng số dư hiện có.</p>
    <p>Số tiền mỗi lần giao dịch không vượt quá ¥10,000,000.</p>
  </aside>
</section>

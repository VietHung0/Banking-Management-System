<section class="page-header">
  <div>
    <h1>入金</h1>
    <p>ログイン中の口座へ入金します。</p>
  </div>
</section>

<section class="work-panel">
  <article class="form-card">
    <span class="card-label">入金手続き</span>
    <h2>入金内容</h2>

    <form (ngSubmit)="onSubmit()">
      <label>
        金額
        <input
          type="number"
          name="amount"
          min="1000"
          max="1000000"
          step="1000"
          [(ngModel)]="depositRequest.amount"
          required
        >
      </label>

      <label>
        暗証番号
        <input
          type="password"
          name="pin"
          [(ngModel)]="depositRequest.pin"
          required
        >
      </label>

      <p class="success-message" *ngIf="successMessage">{{ successMessage }}</p>
      <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? '処理中...' : '入金する' }}
      </button>
    </form>
  </article>

  <aside class="guide-card">
    <h2>お取引時のご注意</h2>
    <p>入金は1,000円以上、1,000円単位で入力してください。</p>
    <p>1回あたりの入金上限は1,000,000円です。</p>
    <p>お取引の確認には暗証番号が必要です。</p>
  </aside>
</section>

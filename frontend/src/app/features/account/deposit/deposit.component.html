<section class="page-header">
  <div>
    <h1>Deposit</h1>
    <p>Nạp tiền vào tài khoản đang đăng nhập.</p>
  </div>
</section>

<section class="work-panel">
  <article class="form-card">
    <span class="card-label">Cash Deposit</span>
    <h2>Thông tin nạp tiền</h2>

    <form (ngSubmit)="onSubmit()">
      <label>
        Số tiền
        <input
          type="number"
          name="amount"
          min="100"
          max="10000000"
          step="100"
          [(ngModel)]="depositRequest.amount"
          required
        >
      </label>

      <label>
        PIN
        <input
          type="password"
          name="pin"
          [(ngModel)]="depositRequest.pin"
          required
        >
      </label>

      <p class="success-message" *ngIf="successMessage">{{ successMessage }}</p>
      <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Đang xử lý...' : 'Nạp tiền' }}
      </button>
    </form>
  </article>

  <aside class="guide-card">
    <h2>Lưu ý giao dịch</h2>
    <p>Số tiền phải là bội số của ¥100.</p>
    <p>Số tiền mỗi lần giao dịch không vượt quá ¥10,000,000.</p>
    <p>PIN dùng để xác nhận thao tác trên tài khoản hiện tại.</p>
  </aside>
</section>

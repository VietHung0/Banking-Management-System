<main class="auth-page">
  <header class="auth-header">
    <div class="brand">
      <span class="brand-mark">N</span>
      <div>
        <strong>ネット銀行デモ</strong>
        <span>インターネットバンキング</span>
      </div>
    </div>
  </header>

  <section class="auth-shell">
    <div class="auth-panel">
      <div class="panel-title">
        <span>口座開設</span>
        <h1>新規口座開設</h1>
        <p>インターネットバンキングをご利用いただくため、お客さま情報を入力してください。</p>
      </div>

      <form class="auth-form" (ngSubmit)="onSubmit()">
        <div class="form-section">
          <h2>お客さま情報</h2>

          <label>
            お名前
            <input type="text" name="name" [(ngModel)]="registerRequest.name" required autocomplete="name">
          </label>

          <label>
            ご住所
            <input type="text" name="address" [(ngModel)]="registerRequest.address" required autocomplete="street-address">
          </label>
        </div>

        <div class="form-section">
          <h2>ご連絡先</h2>

          <label>
            メールアドレス
            <input type="email" name="email" [(ngModel)]="registerRequest.email" required autocomplete="email">
          </label>

          <div class="phone-row">
            <label>
              国番号
              <input type="text" name="countryCode" [(ngModel)]="registerRequest.countryCode" required>
            </label>

            <label>
              電話番号
              <input type="tel" name="phoneNumber" [(ngModel)]="registerRequest.phoneNumber" required autocomplete="tel">
            </label>
          </div>
        </div>

        <div class="form-section">
          <h2>ログイン設定</h2>

          <label>
            WEBログインパスワード
            <input type="password" name="password" [(ngModel)]="registerRequest.password" required autocomplete="new-password">
          </label>
        </div>

        <p class="success-message" *ngIf="successMessage">{{ successMessage }}</p>
        <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

        <button type="submit" [disabled]="isLoading">
          {{ isLoading ? '登録中...' : '口座を開設する' }}
        </button>
      </form>
    </div>

    <aside class="guide-panel">
      <section>
        <h2>すでに口座をお持ちの方</h2>
        <p>メールアドレスまたは口座番号でログインできます。</p>
        <a routerLink="/login">ログイン</a>
      </section>

      <section>
        <h2>セキュリティのお願い</h2>
        <ul>
          <li>暗証番号と同じパスワードは設定しないでください。</li>
          <li>WEBログインパスワードを第三者に共有しないでください。</li>
          <li>正しいお客さま情報を入力してください。</li>
        </ul>
      </section>
    </aside>
  </section>
</main>

<main class="auth-page">
  <header class="auth-header">
    <div class="brand">
      <span class="brand-mark">N</span>
      <div>
        <strong>NetBank Demo</strong>
        <span>Internet Banking</span>
      </div>
    </div>
  </header>

  <section class="auth-content">
    <div class="login-box">
      <h1>Đăng nhập</h1>
      <p class="intro">Nhập email hoặc số tài khoản để truy cập dịch vụ ngân hàng trực tuyến.</p>

      <form class="auth-form" (ngSubmit)="onSubmit()">
        <label>
          Email / Số tài khoản
          <input
            type="text"
            name="identifier"
            [(ngModel)]="loginRequest.identifier"
            required
            autocomplete="username"
          >
        </label>

        <label>
          Mật khẩu WEB
          <input
            type="password"
            name="password"
            [(ngModel)]="loginRequest.password"
            required
            autocomplete="current-password"
          >
        </label>

        <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

        <button type="submit" [disabled]="isLoading">
          {{ isLoading ? 'Đang đăng nhập...' : 'Đăng nhập' }}
        </button>
      </form>
    </div>

    <aside class="support-box">
      <h2>Khách hàng mới</h2>
      <p>Mở tài khoản demo để sử dụng dashboard, nạp tiền, rút tiền và chuyển khoản.</p>
      <a routerLink="/register">Đăng ký tài khoản</a>
    </aside>
  </section>
</main>

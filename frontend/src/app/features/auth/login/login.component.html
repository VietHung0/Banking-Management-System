<main class="auth-page">
  <header class="auth-header">
    <div class="brand">
      <span class="brand-mark">N</span>
      <div>
        <strong>ネット銀行デモ</strong>
        <span>インターネットバンキング</span>
      </div>
    </div>
  </header>

  <section class="auth-content">
    <div class="login-box">
      <h1>ログイン</h1>
      <p class="intro">メールアドレスまたは口座番号を入力して、インターネットバンキングにログインしてください。</p>

      <form class="auth-form" (ngSubmit)="onSubmit()">
        <label>
          メールアドレス / 口座番号
          <input
            type="text"
            name="identifier"
            [(ngModel)]="loginRequest.identifier"
            required
            autocomplete="username"
          >
        </label>

        <label>
          WEBログインパスワード
          <input
            type="password"
            name="password"
            [(ngModel)]="loginRequest.password"
            required
            autocomplete="current-password"
          >
        </label>

        <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

        <button type="submit" [disabled]="isLoading">
          {{ isLoading ? 'ログイン中...' : 'ログイン' }}
        </button>
      </form>
    </div>

    <aside class="support-box">
      <h2>はじめてご利用の方</h2>
      <p>デモ口座を開設すると、入金・出金・振込などの機能をご利用いただけます。</p>
      <a routerLink="/register">口座開設</a>
    </aside>
  </section>
</main>
